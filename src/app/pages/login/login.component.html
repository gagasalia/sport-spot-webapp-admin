<div class="auth">
  <div class="auth-orb" aria-hidden="true"></div>
  <div class="auth-ring" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <span class="auth-brand-dot" aria-hidden="true">
        <i class="ss-ic" style="--ss-ic: url('logos/mark-mono-tight.svg')"></i>
      </span>
      <span class="auth-brand-name">Sport Space</span>
      <span class="auth-brand-admin">Admin</span>
    </div>

    <h1 class="auth-title georgian-text" lang="ka">ავტორიზაცია</h1>
    <p class="auth-sub georgian-text" lang="ka">შედი მართვის პანელში</p>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      <!-- Phone -->
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          ტელეფონი <span class="auth-req">*</span>
        </span>
        <input
          class="ss-input"
          [class.ss-input--invalid]="loginForm.get('phone')?.touched && loginForm.get('phone')?.invalid"
          type="tel"
          formControlName="phone"
          autocomplete="tel"
        />
        @if (loginForm.get('phone')?.touched && loginForm.get('phone')?.hasError('required')) {
          <span class="ss-error georgian-text" lang="ka">ტელეფონი სავალდებულოა</span>
        }
      </label>

      <!-- Password -->
      <label class="ss-field">
        <span class="ss-label georgian-text" lang="ka">
          პაროლი <span class="auth-req">*</span>
        </span>
        <input
          class="ss-input"
          [class.ss-input--invalid]="loginForm.get('password')?.touched && loginForm.get('password')?.invalid"
          type="password"
          formControlName="password"
          autocomplete="current-password"
        />
        @if (loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')) {
          <span class="ss-error georgian-text" lang="ka">პაროლი სავალდებულოა</span>
        }
      </label>

      <!-- Server error (e.g. 401 wrong credentials) -->
      @if (loginError()) {
        <div class="auth-error georgian-text" lang="ka" data-testid="login-error">
          {{ loginError() }}
        </div>
      }

      <button
        class="ss-btn ss-btn--primary ss-btn--block auth-submit"
        type="submit"
        [disabled]="isSubmitting()"
      >
        <span class="georgian-text" lang="ka">{{ isSubmitting() ? 'იტვირთება...' : 'შესვლა' }}</span>
      </button>
    </form>
  </div>
</div>
